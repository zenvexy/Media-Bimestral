<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos | Média Bimestral</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body data-page="alunos">
    <header>
      <h1>Alunos</h1>
      <p>Cadastre e consulte os alunos.</p>

      <nav>
        <a href="home.html">Início</a>
        <a href="professores.html">Professores</a>
        <a class="ativo" href="alunos.html">Alunos</a>
        <a href="notas.html">Notas</a>
        <a href="materias.html">Matérias</a>
        <span id="professorLogado" class="professor-logado"></span>
        <a id="sair" href="login.html">Sair</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Novo aluno</h2>

        <form id="formAluno">
          <label>
            Nome
            <input id="nome" required>
          </label>

          <button type="submit">Cadastrar</button>
          <button id="cancelar" type="button" hidden>Cancelar</button>
        </form>
      </section>

      <p id="mensagem" class="mensagem" aria-live="polite"></p>

      <section>
        <h2>Alunos cadastrados</h2>

        <div class="tabela">
          <table>
            <thead>
              <tr>
                <th>Matrícula</th>
                <th>Nome</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="listaAlunos"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>Frontend Média Bimestral</footer>
  </body>
</html>
