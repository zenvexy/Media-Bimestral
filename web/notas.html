<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas | Média Bimestral</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body data-page="notas">
    <header>
      <h1>Notas</h1>
      <p>Cadastre as quatro notas; a média final é calculada pela API.</p>

      <nav>
        <a href="home.html">Início</a>
        <a href="professores.html">Professores</a>
        <a href="alunos.html">Alunos</a>
        <a class="ativo" href="notas.html">Notas</a>
        <a href="materias.html">Matérias</a>
        <span id="professorLogado" class="professor-logado"></span>
        <a id="sair" href="login.html">Sair</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Nova nota</h2>

        <form id="formNota">
          <label>
            Matrícula do aluno
            <input id="alunoMatricula" type="number" min="1" required>
          </label>

          <label>
            ID do professor
            <input id="professorId" type="number" min="1" required>
          </label>

          <label>
            1º bimestre
            <input id="bimestre1" type="number" step="0.1" required>
          </label>

          <label>
            2º bimestre
            <input id="bimestre2" type="number" step="0.1" required>
          </label>

          <label>
            3º bimestre
            <input id="bimestre3" type="number" step="0.1" required>
          </label>

          <label>
            4º bimestre
            <input id="bimestre4" type="number" step="0.1" required>
          </label>

          <button type="submit">Cadastrar</button>
          <button id="cancelar" type="button" hidden>Cancelar</button>
        </form>
      </section>

      <p id="mensagem" class="mensagem" aria-live="polite"></p>

      <section>
        <h2>Notas cadastradas</h2>

        <div class="tabela">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Aluno</th>
                <th>Professor</th>
                <th>1º</th>
                <th>2º</th>
                <th>3º</th>
                <th>4º</th>
                <th>Média</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="listaNotas"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>Frontend Média Bimestral</footer>
  </body>
</html>
